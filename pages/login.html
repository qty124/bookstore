<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 东软汇达</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 15px; padding: 40px 50px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #667eea; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #667eea; }
        .form-group input.error { border-color: #ff6b6b; }
        .error-msg { color: #ff6b6b; font-size: 12px; margin-top: 5px; display: none; }
        .remember { display: flex; align-items: center; margin-bottom: 20px; }
        .remember input { margin-right: 8px; }
        .remember label { font-size: 14px; color: #666; }
        .login-btn { width: 100%; padding: 12px; border: none; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px; font-size: 16px; cursor: pointer; transition: transform 0.3s; }
        .login-btn:hover { transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; }
        .links a { color: #667eea; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">东软汇达</div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>用户名/手机/邮箱</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
                <div class="error-msg" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
                <div class="error-msg" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="captcha" placeholder="请输入验证码" required style="flex:1">
                    <canvas id="captchaCanvas" width="80" height="36" style="border-radius:5px;cursor:pointer" onclick="generateCaptcha()"></canvas>
                </div>
                <div class="error-msg" id="captchaError"></div>
            </div>
            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">记住我</label>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登录</button>
        </form>
        <div class="links">
            <a href="findpwd.html">忘记密码？</a>
            <a href="register.html">注册新账号</a>
        </div>
    </div>

    <script>
        let captchaCode = '';

        function generateCaptcha() {
            const canvas = document.getElementById('captchaCanvas');
            const ctx = canvas.getContext('2d');
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
            captchaCode = '';
            for (let i = 0; i < 4; i++) {
                captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, 80, 36);
            ctx.font = '20px Arial';
            ctx.fillStyle = '#333';
            ctx.fillText(captchaCode, 15, 25);
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(Math.random() * 80, Math.random() * 36, 2, 2);
            }
        }

        function validateLogin() {
            let isValid = true;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const captcha = document.getElementById('captcha').value.trim();

            if (username.length < 2) {
                showError('username', '用户名至少2个字符');
                isValid = false;
            }
            if (password.length < 6) {
                showError('password', '密码至少6个字符');
                isValid = false;
            }
            if (captcha.toLowerCase() !== captchaCode.toLowerCase()) {
                showError('captcha', '验证码错误');
                isValid = false;
                generateCaptcha();
            }
            return isValid;
        }

        function showError(field, msg) {
            const input = document.getElementById(field);
            const error = document.getElementById(field + 'Error');
            input.classList.add('error');
            error.textContent = msg;
            error.style.display = 'block';
        }

        function clearError(field) {
            const input = document.getElementById(field);
            const error = document.getElementById(field + 'Error');
            input.classList.remove('error');
            error.style.display = 'none';
        }

        function handleLogin(e) {
            e.preventDefault();
            if (!validateLogin()) return;

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                alert('登录成功！');
                window.location.href = 'index.html';
            } else {
                showError('username', '用户名或密码错误');
            }
        }

        document.getElementById('username').oninput = () => clearError('username');
        document.getElementById('password').oninput = () => clearError('password');
        document.getElementById('captcha').oninput = () => clearError('captcha');

        generateCaptcha();
    </script>
</body>
</html>
