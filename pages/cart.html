<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 东软汇达</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 0; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        h1 { font-size: 22px; margin-bottom: 20px; }
        .cart-empty { text-align: center; padding: 60px; background: white; border-radius: 10px; }
        .cart-empty p { font-size: 18px; color: #999; margin-bottom: 20px; }
        .cart-empty a { padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; }
        .cart-table { background: white; border-radius: 10px; overflow: hidden; }
        .cart-table table { width: 100%; border-collapse: collapse; }
        .cart-table th { background: #f8f8f8; padding: 15px; text-align: left; font-size: 14px; color: #666; }
        .cart-table td { padding: 15px; border-top: 1px solid #eee; vertical-align: middle; }
        .cart-item-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .item-name { font-size: 14px; color: #333; }
        .item-price { color: #ff6b6b; font-weight: bold; }
        .qty-control { display: flex; align-items: center; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .qty-num { width: 50px; text-align: center; height: 28px; border: 1px solid #ddd; border-left: none; border-right: none; outline: none; }
        .delete-btn { padding: 5px 15px; border: 1px solid #ff6b6b; background: white; color: #ff6b6b; border-radius: 5px; cursor: pointer; }
        .delete-btn:hover { background: #ff6b6b; color: white; }
        .cart-footer { background: white; border-radius: 10px; margin-top: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .cart-total { font-size: 18px; }
        .cart-total span { color: #ff6b6b; font-size: 24px; font-weight: bold; }
        .checkout-btn { padding: 12px 40px; border: none; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .select-all { display: flex; align-items: center; font-size: 14px; color: #666; }
        .select-all input { margin-right: 8px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">东软汇达</div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="user.html">个人中心</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>我的购物车</h1>
        <div id="cartContent"></div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        function renderCart() {
            const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
            if (!user) {
                document.getElementById('cartContent').innerHTML = '<div class="cart-empty"><p>请先登录后查看购物车</p><a href="login.html">去登录</a></div>';
                return;
            }
            const cart = JSON.parse(localStorage.getItem('cart_' + user.username) || '[]');
            if (cart.length === 0) {
                document.getElementById('cartContent').innerHTML = '<div class="cart-empty"><p>购物车是空的</p><a href="index.html">去逛逛</a></div>';
                return;
            }
            const products = getProducts();
            let total = 0;
            let html = '<div class="cart-table"><table><thead><tr><th><label class="select-all"><input type="checkbox" id="selectAll" checked onchange="toggleAll(this)">全选</label></th><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr></thead><tbody>';
            cart.forEach(item => {
                const p = products.find(x => x.id === item.id) || products[0];
                const subtotal = p.price * item.qty;
                total += subtotal;
                html += `<tr>
                    <td><input type="checkbox" class="item-check" checked data-id="${item.id}"></td>
                    <td><img src="${p.image || '../images/product1.svg'}" class="cart-item-img" style="margin-right:10px;vertical-align:middle">${p.name}</td>
                    <td class="item-price">¥${p.price}</td>
                    <td>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="changeItemQty(${item.id},-1)">-</button>
                            <input type="number" class="qty-num" value="${item.qty}" onchange="updateItemQty(${item.id},this.value)">
                            <button class="qty-btn" onclick="changeItemQty(${item.id},1)">+</button>
                        </div>
                    </td>
                    <td class="item-price">¥${subtotal.toFixed(2)}</td>
                    <td><button class="delete-btn" onclick="removeItem(${item.id})">删除</button></td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            html += `<div class="cart-footer">
                <div class="cart-total">合计：<span>¥${total.toFixed(2)}</span></div>
                <button class="checkout-btn" onclick="checkout()">去结算</button>
            </div>`;
            document.getElementById('cartContent').innerHTML = html;
        }

        function changeItemQty(id, delta) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            let cart = JSON.parse(localStorage.getItem('cart_' + user.username) || '[]');
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(1, item.qty + delta);
                localStorage.setItem('cart_' + user.username, JSON.stringify(cart));
                renderCart();
            }
        }

        function updateItemQty(id, val) {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            let cart = JSON.parse(localStorage.getItem('cart_' + user.username) || '[]');
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(1, parseInt(val) || 1);
                localStorage.setItem('cart_' + user.username, JSON.stringify(cart));
                renderCart();
            }
        }

        function removeItem(id) {
            if (!confirm('确定删除该商品？')) return;
            const user = JSON.parse(localStorage.getItem('currentUser'));
            let cart = JSON.parse(localStorage.getItem('cart_' + user.username) || '[]');
            cart = cart.filter(i => i.id !== id);
            localStorage.setItem('cart_' + user.username, JSON.stringify(cart));
            renderCart();
        }

        function toggleAll(checkbox) {
            document.querySelectorAll('.item-check').forEach(cb => cb.checked = checkbox.checked);
        }

        function checkout() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const cart = JSON.parse(localStorage.getItem('cart_' + user.username) || '[]');
            if (cart.length === 0) { alert('购物车为空'); return; }
            window.location.href = 'checkout.html';
        }

        renderCart();
    </script>
</body>
</html>
