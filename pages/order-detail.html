<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 东软汇达</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 0; }
        .header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        h1 { font-size: 22px; margin-bottom: 20px; }
        .order-box { background: white; border-radius: 10px; padding: 25px; }
        .order-header { display: flex; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .order-status { color: #ff6b6b; font-size: 18px; font-weight: bold; }
        .order-info { margin-bottom: 20px; }
        .order-info p { margin: 5px 0; font-size: 14px; color: #666; }
        .product-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f5f5f5; }
        .product-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .product-item-info { flex: 1; }
        .product-item-name { font-size: 14px; color: #333; }
        .product-item-meta { font-size: 12px; color: #999; margin-top: 5px; }
        .product-item-price { font-size: 16px; color: #ff6b6b; font-weight: bold; }
        .total-row { display: flex; justify-content: flex-end; margin-top: 20px; font-size: 18px; }
        .total-row span { color: #ff6b6b; font-weight: bold; font-size: 24px; }
        .btn-group { display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; }
        .btn { padding: 10px 30px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { border: 1px solid #ddd; background: white; color: #333; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">东软汇达</div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="cart.html">购物车</a>
                <a href="user.html">个人中心</a>
            </div>
        </div>
    </header>
    <div class="container">
        <h1>订单详情</h1>
        <div class="order-box">
            <div class="order-header">
                <div>
                    <strong>订单号：</strong><span id="orderNo"></span>
                    <strong style="margin-left:20px">下单时间：</strong><span id="orderDate"></span>
                </div>
                <div class="order-status" id="orderStatus">待支付</div>
            </div>
            <div class="order-info">
                <p><strong>收货地址：</strong><span id="orderAddress"></span></p>
            </div>
            <div id="productList"></div>
            <div class="total-row">实付金额：<span id="orderTotal"></span></div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="location.href='user.html'">返回</button>
                <button class="btn btn-primary" id="actionBtn" onclick="doAction()">立即支付</button>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderNo = urlParams.get('no');
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const orders = JSON.parse(localStorage.getItem('orders_' + user.username) || '[]');
        const order = orders.find(o => o.orderNo === orderNo);

        if (!order) {
            alert('订单不存在');
            location.href = 'user.html';
        } else {
            document.getElementById('orderNo').textContent = order.orderNo;
            document.getElementById('orderDate').textContent = order.date;
            document.getElementById('orderStatus').textContent = order.status;
            document.getElementById('orderAddress').textContent = order.address;

            const products = getProducts();
            let html = '';
            order.items.forEach(item => {
                const p = products.find(x => x.id === item.id) || products[0];
                html += `<div class="product-item">
                    <img src="${p.image || '../images/product1.svg'}">
                    <div class="product-item-info">
                        <div class="product-item-name">${p.name}</div>
                        <div class="product-item-meta">x${item.qty}</div>
                    </div>
                    <div class="product-item-price">¥${(p.price * item.qty).toFixed(2)}</div>
                </div>`;
            });
            document.getElementById('productList').innerHTML = html;
            document.getElementById('orderTotal').textContent = '¥' + order.total.toFixed(2);

            if (order.status === '待支付') {
                document.getElementById('actionBtn').textContent = '立即支付';
                document.getElementById('actionBtn').onclick = () => {
                    order.status = '待发货';
                    localStorage.setItem('orders_' + user.username, JSON.stringify(orders));
                    alert('支付成功！');
                    location.reload();
                };
            } else {
                document.getElementById('actionBtn').style.display = 'none';
            }
        }
    </script>
</body>
</html>
